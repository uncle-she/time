<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable"
          content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <title>实时时间显示</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: black;
            color: rgb(200, 200, 200);
            font-family: Arial, sans-serif;
        }

        #time-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #time {
            font-size: 40vw;
            text-align: center;
            font-weight: bold;
            display: block;
            margin-bottom: -6vw;
        }

        #footer {
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            width: 50%;
            font-size: 4vw;
            font-weight: bold;
        }

        #temperature,
        #weather-block {
            position: absolute;
            top: 0;
            font-size: 4vw;
            font-weight: bold;
        }

        #temperature {
            left: 2vw;
            white-space: nowrap;
        }

        #temperature-min,
        #temperature-max {
            font-size: 2vw;
            margin: 0 0.8vw;
        }

        /* 天气行：左侧为当日降雨概率，右侧为天气文字，整体高度与天气文字行高一致 */
        #weather-block {
            right: 4vw;
            display: flex;
            align-items: center;
            gap: 1.2vw;
            height: 1.15em;
        }

        #weather {
            line-height: 1.15;
            white-space: nowrap;
        }

        /* 降雨概率：降雨云图标在上，百分比在下，压缩在天气文字的行高内 */
        #precipitation {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            line-height: 1;
            color: #5bc0eb;
        }

        #precipitation-icon {
            display: block;
            height: 0.6em;
            width: auto;
        }

        #precipitation-probability {
            font-size: 0.5em;
            line-height: 1;
            margin-top: 0.03em;
            white-space: nowrap;
        }

        #days-of-week-english {
            position: absolute;
            display: flex;
            font-size: 2vw;
            margin-top: -0.8vw;
        }
        
        #months-of-year-english {
            position: absolute;
            display: flex;
            font-size: 2vw;
            margin-top: -0.8vw;
        }

        @media (min-width: 600px) {
            #time {
                font-size: 30vw;
                margin-bottom: -4.5vw;
            }

            #footer {
                width: 58%;
                font-size: 5vw;
            }

            #temperature,
            #weather-block {
                font-size: 5vw;
            }

            #temperature-min,
            #temperature-max {
                font-size: 2.5vw;
            }

            #days-of-week-english {
                font-size: 2.5vw;
            }
            
            #months-of-year-english {
                font-size: 2.5vw;
            }
        }

        @media (min-width: 900px) {
            #time {
                font-size: 20vw;
                margin-bottom: -3.2vw;
            }

            #footer {
                font-size: 3.2vw;
            }

            #temperature,
            #weather-block {
                font-size: 3.2vw;
            }

            #temperature-min,
            #temperature-max {
                font-size: 1.6vw;
            }

            #days-of-week-english {
                font-size: 1.6vw;
            }
            
            #months-of-year-english {
                font-size: 1.6vw;
            }
        }
    </style>
</head>

<body>
    <div id="time-container">
        <div id="temperature"><span id="temperature-min"></span><span id="temperature-current"></span><span id="temperature-max"></span></div>
        <div id="weather-block">
            <div id="precipitation" style="display: none;" title="当日降雨概率">
                <svg id="precipitation-icon" viewBox="4 4.2 15.5 16.4" aria-hidden="true">
                    <g fill="#eeeeee">
                        <circle cx="9.2" cy="9" r="4.3"/>
                        <circle cx="15.6" cy="10.4" r="3.2"/>
                        <rect x="5.2" y="9.8" width="13.4" height="3.8" rx="1.9"/>
                    </g>
                    <g stroke="#5bc0eb" stroke-width="1.7" stroke-linecap="round">
                        <path d="M8.5 16.5 7.3 20"/>
                        <path d="M12.3 16.5 11.1 20"/>
                        <path d="M16.1 16.5 14.9 20"/>
                    </g>
                </svg>
                <span id="precipitation-probability"></span>
            </div>
            <div id="weather"></div>
        </div>
        <div id="time"></div>
        <div id="footer">
            <div id="date">
                <div id="months-of-year-english"></div>
                <span id="month-text"></span>
                <span id="date-number"></span>
                <span id="day-text"></span>
            </div>
            <div id="days-of-week">
                <div id="days-of-week-english"></div>
                <div id="days-of-week-chinese"></div>
            </div>
        </div>
    </div>

    <script src="./NoSleep.min.js"></script>
    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const dayIndex = now.getDay();
            const daysOfWeekArray = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const daysOfWeek = daysOfWeekArray[dayIndex];

            const daysOfWeekEnglishArray = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const daysOfWeekEnglish = daysOfWeekEnglishArray[dayIndex];
            
            const monthsOfYearEnglishArray = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const monthIndex = now.getMonth();
            const monthsOfYearEnglish = monthsOfYearEnglishArray[monthIndex];

            const month = now.getMonth() + 1;
            const date = now.getDate();

            document.getElementById('time').textContent = `${hours}:${minutes}`;
            document.getElementById('month-text').textContent = `${month} 月 `;
            document.getElementById('date-number').textContent = `${date}`;
            document.getElementById('day-text').textContent = ` 日`;
            document.getElementById('months-of-year-english').textContent = `${monthsOfYearEnglish}`;
            
            // 获取日期数字元素
            const dateNumberElement = document.getElementById('date-number');
            
            // 设置中午 12 点到 24 点之间日期数字为红色（除非已被点击）
            if (hours >= 12 && hours <= 23) {
                // 如果没有被点击过，则自动设为红色
                if (!dateNumberElement.classList.contains('clicked')) {
                    dateNumberElement.style.color = 'red';
                }
                // 如果已被点击过，则保持用户选择的颜色状态
            } else {
                // 午夜后重置颜色和点击状态
                dateNumberElement.style.color = 'rgb(200, 200, 200)';
                dateNumberElement.classList.remove('clicked');
                dateNumberElement.classList.remove('manual-red'); // 清除手动红色状态
            }
            
            document.getElementById('days-of-week-chinese').textContent = `${daysOfWeek}`;
            document.getElementById('days-of-week-english').textContent = `${daysOfWeekEnglish}`;
        }
        setInterval(updateTime, 1000);
        updateTime(); // initial call to display time immediately

        // 添加点击事件监听器 - 点击日期区域在红色和普通颜色间切换
        document.getElementById('date').addEventListener('click', function() {
            const dateNumberElement = document.getElementById('date-number');
            const currentColor = dateNumberElement.style.color;
            
            // 切换颜色：如果当前是普通颜色则变为红色，否则变为普通颜色
            if (currentColor === '' || currentColor === 'rgb(200, 200, 200)' || currentColor === 'white') {
                dateNumberElement.style.color = 'red';
                dateNumberElement.classList.add('manual-red');
            } else {
                dateNumberElement.style.color = 'rgb(200, 200, 200)';
                dateNumberElement.classList.remove('manual-red');
            }
            
            // 标记为已点击
            dateNumberElement.classList.add('clicked');
        });
        
        // 添加点击星期几区域的事件监听器
        document.getElementById('days-of-week').addEventListener('click', function() {
            const dateNumberElement = document.getElementById('date-number');
            const currentColor = dateNumberElement.style.color;
            
            // 切换颜色：如果当前是普通颜色则变为红色，否则变为普通颜色
            if (currentColor === '' || currentColor === 'rgb(200, 200, 200)' || currentColor === 'white') {
                dateNumberElement.style.color = 'red';
                dateNumberElement.classList.add('manual-red');
            } else {
                dateNumberElement.style.color = 'rgb(200, 200, 200)';
                dateNumberElement.classList.remove('manual-red');
            }
            
            // 标记为已点击
            dateNumberElement.classList.add('clicked');
        });

        // 气温与天气显示：从 Prometheus 格式的 metrics 接口读取
        const METRICS_URL = 'https://gateway.uncle.im:6442/openmeteo/metrics';
        const METRICS_REFRESH_MS = 15 * 60 * 1000; // 接口上报间隔为 900 秒

        // WMO 天气代码对应中文（Open-Meteo weather_code）
        const WEATHER_CODE_ZH = {
            0: '晴',
            1: '晴间多云',
            2: '多云',
            3: '阴',
            45: '雾',
            48: '冻雾',
            51: '小毛毛雨',
            53: '毛毛雨',
            55: '密毛毛雨',
            56: '冻毛毛雨',
            57: '强冻毛毛雨',
            61: '小雨',
            63: '中雨',
            65: '大雨',
            66: '冻雨',
            67: '强冻雨',
            71: '小雪',
            73: '中雪',
            75: '大雪',
            77: '米雪',
            80: '小阵雨',
            81: '阵雨',
            82: '强阵雨',
            85: '小阵雪',
            86: '大阵雪',
            95: '雷阵雨',
            96: '雷阵雨伴小冰雹',
            99: '雷阵雨伴大冰雹'
        };

        // 从 Prometheus 文本中解析指定指标的数值
        function parseMetricValue(text, metricName) {
            const pattern = new RegExp('^' + metricName + '\\{[^}]*\\}\\s+([-+0-9.eE]+)\\s*$', 'm');
            const match = text.match(pattern);
            return match ? parseFloat(match[1]) : null;
        }

        const weatherElement = document.getElementById('weather');
        const precipitationElement = document.getElementById('precipitation');
        let lastWeatherZh = '';
        let lastObservationTime = null; // openmeteo_time，Unix 秒
        let showObservationTime = false; // 点击天气后切换为显示观测时间

        // 将 Unix 秒格式化为北京时间（UTC+8），只保留到分钟，不显示年份
        // 不使用 Intl.DateTimeFormat：部分老款安卓 WebView 不支持 formatToParts，
        // 或缺少 Asia/Shanghai 时区数据，会在点击时抛异常导致毫无反应
        function formatBeijingTime(unixSeconds) {
            const beijing = new Date((unixSeconds + 8 * 60 * 60) * 1000);
            function pad(n) {
                return n < 10 ? '0' + n : String(n);
            }
            return pad(beijing.getUTCMonth() + 1) + '-' + pad(beijing.getUTCDate()) +
                ' ' + pad(beijing.getUTCHours()) + ':' + pad(beijing.getUTCMinutes());
        }

        function renderWeather() {
            if (showObservationTime && lastObservationTime !== null) {
                weatherElement.textContent = formatBeijingTime(lastObservationTime);
            } else {
                weatherElement.textContent = lastWeatherZh;
            }
        }

        // 点击天气区域：在天气和观测时间之间切换
        weatherElement.addEventListener('click', function () {
            if (lastObservationTime === null) {
                return;
            }
            showObservationTime = !showObservationTime;
            renderWeather();
        });

        async function updateWeather() {
            try {
                const response = await fetch(METRICS_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const text = await response.text();

                const temperature = parseMetricValue(text, 'openmeteo_temperature');
                if (temperature !== null && !Number.isNaN(temperature)) {
                    document.getElementById('temperature-current').textContent = `${temperature.toFixed(0)}°C`;
                }

                const temperatureMin = parseMetricValue(text, 'openmeteo_temperature_min');
                if (temperatureMin !== null && !Number.isNaN(temperatureMin)) {
                    document.getElementById('temperature-min').textContent = `${temperatureMin.toFixed(0)}°`;
                }

                const temperatureMax = parseMetricValue(text, 'openmeteo_temperature_max');
                if (temperatureMax !== null && !Number.isNaN(temperatureMax)) {
                    document.getElementById('temperature-max').textContent = `${temperatureMax.toFixed(0)}°`;
                }

                const weatherCode = parseMetricValue(text, 'openmeteo_weather_code');
                const weatherZh = WEATHER_CODE_ZH[weatherCode];
                if (weatherZh) {
                    lastWeatherZh = weatherZh;
                } else {
                    console.warn('未知的天气代码：', weatherCode);
                }

                const precipitationProbabilityMax = parseMetricValue(text, 'openmeteo_precipitation_probability_max');
                if (precipitationProbabilityMax !== null && !Number.isNaN(precipitationProbabilityMax)) {
                    document.getElementById('precipitation-probability').textContent = `${precipitationProbabilityMax.toFixed(0)}%`;
                    precipitationElement.style.display = 'flex';
                }

                const observationTime = parseMetricValue(text, 'openmeteo_time');
                if (observationTime !== null && !Number.isNaN(observationTime)) {
                    lastObservationTime = observationTime;
                }

                renderWeather();
            } catch (error) {
                // 获取失败时保留上一次的数值，不显示错误信息
                console.warn('获取气象数据失败：', error);
            }
        }

        updateWeather();
        setInterval(updateWeather, METRICS_REFRESH_MS);

        // 启用 NoSleep.js 防止设备睡眠
        const noSleep = new NoSleep();

        document.addEventListener('click', function enableNoSleep() {
            noSleep.enable();
            document.removeEventListener('click', enableNoSleep, false);
        }, false);
    </script>
</body>

</html>
